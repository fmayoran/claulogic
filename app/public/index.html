<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClauLogic</title>
<link rel="stylesheet" href="comun.css">
<style>
  .dos{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
  .salud{margin-top:28px;color:var(--mut);font-size:.85rem;display:flex;gap:8px;align-items:center;}
  .p{width:7px;height:7px;border-radius:50%;background:#b9b5ad;} .p.ok{background:#2e9e4f;} .p.mal{background:#c4352b;}
</style>
</head>
<body>
<main class="ancho">
  <h1>Panel</h1>
  <p class="sub">Lo que hay que atender hoy en el almacén.</p>
  <div id="esc" style="max-width:560px;margin:0 0 18px"></div>
  <div class="tarjetas">
    <a class="tarjeta" id="tMin" href="stock.html?bajo_minimo=1"><div class="v">–</div><div class="t">productos bajo el mínimo</div></a>
    <a class="tarjeta" id="tVence" href="stock.html?vence_dias=7"><div class="v">–</div><div class="t">lotes que vencen en 7 días</div></a>
    <a class="tarjeta" id="tFrio" href="frio.html"><div class="v">–</div><div class="t">equipos de frío para revisar</div></a>
    <a class="tarjeta" id="tCompras" href="compras.html"><div class="v">–</div><div class="t">compras por recibir</div></a>
  </div>
  <div class="dos">
    <section>
      <h2>Próximos vencimientos</h2>
      <div class="tabla-wrap"><table class="datos">
        <thead><tr><th>Producto</th><th>Lote</th><th>Dónde</th><th class="num">Cantidad</th><th>Vence</th></tr></thead>
        <tbody id="vence"></tbody></table></div>
    </section>
    <section>
      <h2>Bajo el mínimo</h2>
      <div class="tabla-wrap"><table class="datos">
        <thead><tr><th>Producto</th><th class="num">Hay</th><th class="num">Mínimo</th></tr></thead>
        <tbody id="minimo"></tbody></table></div>
    </section>
  </div>
  <p class="salud"><span class="p" id="p"></span><span id="t">consultando…</span></p>
</main>
<script src="comun.js"></script>
<script>
function tarjeta(id, n, tipo) {
  const t = $(id); t.querySelector('.v').textContent = n;
  t.classList.toggle(tipo, n > 0);
}
// Escanear desde el inicio: un lote abre su trazabilidad; un producto, su ficha.
const esc = escaner(d => {
  if (d.desconocido) throw new Error(`El GTIN ${d.lectura.gtin} no está asignado a ningún producto. Cargalo desde Productos.`);
  if (d.lote) return void (location.href = 'trazabilidad.html?lote_id=' + d.lote.id);
  if (d.lectura.lote) throw new Error(`${d.producto.nombre}: el lote ${d.lectura.lote} no está registrado.`);
  location.href = 'productos.html?id=' + d.producto.id;
}, { placeholder: 'Escanear producto o lote' });
$('#esc').append(esc);

(async () => {
  try {
    const [{ productos }, { stock }, { equipos }, { compras }] = await Promise.all([
      api('stock/productos?bajo_minimo=1'), api('stock?vence_dias=7'), api('frio'), api('compras')]);
    const vence = stock.filter(s => !s.cantidad.startsWith('-') && s.vencimiento);
    tarjeta('#tMin', productos.length, 'aviso');
    tarjeta('#tVence', vence.length, 'mal');
    tarjeta('#tFrio', equipos.filter(e => e.desvio || e.sin_lectura_reciente).length, 'mal');
    tarjeta('#tCompras', compras.filter(c => c.estado === 'pedida' || c.estado === 'borrador').length, 'aviso');
    filas($('#vence'), vence.slice(0, 12), s => el('tr', {},
      td(s.producto), td(s.lote), td(`${s.almacen} · ${s.ubicacion}`),
      td(cant(s.cantidad, s.unidad_base), 'num'), el('td', {}, fecha(s.vencimiento), ' ', tagVence(s.vencimiento))),
      'Nada vence en los próximos 7 días.', 5);
    filas($('#minimo'), productos, p => el('tr', {},
      td(p.nombre), td(cant(p.cantidad, p.unidad_base), 'num'), td(cant(p.stock_minimo, p.unidad_base), 'num')),
      'Ningún producto está bajo el mínimo.', 3);
  } catch (e) { $('#t').textContent = 'Error: ' + e.message; }
  fetch('salud').then(r => r.json()).then(d => {
    $('#p').className = 'p ' + (d.ok ? 'ok' : 'mal');
    $('#t').textContent = d.ok ? `base ${d.base} responde en ${d.ms} ms` : 'la base no responde';
  }).catch(() => { $('#p').className = 'p mal'; $('#t').textContent = 'sin respuesta del servidor'; });
})();
</script>
</body>
</html>
