<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClauLogic</title>
<link rel="stylesheet" href="comun.css">
<style>
  .dos{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
  .salud{margin-top:28px;color:var(--mut);font-size:.85rem;display:flex;gap:8px;align-items:center;}
  .p{width:7px;height:7px;border-radius:50%;background:#b9b5ad;} .p.ok{background:#2e9e4f;} .p.mal{background:#c4352b;}
  /* Proceso de abastecimiento: los dos inicios y la bandeja de lo que quedó a mitad de camino. */
  .abast{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px 18px;margin:0 0 24px;}
  .abast .cab{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 12px;}
  .abast .cab h2{margin:0;} .abast .cab .botones{display:flex;gap:8px;flex-wrap:wrap;}
  .pend{display:grid;gap:8px;}
  .pend a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--fg);text-decoration:none;}
  .pend a:hover{border-color:var(--acento);}
  .pend .q{font-weight:650;} .pend .m{grid-column:1;color:var(--mut);font-size:.86rem;} .pend .i{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-weight:650;}
</style>
</head>
<body>
<main class="ancho">
  <h1>Panel</h1>
  <p class="sub">Lo que hay que atender hoy en el almacén.</p>
  <section class="abast" id="abastecimiento" hidden>
    <div class="cab">
      <h2>Proceso de abastecimiento <span class="tag" id="nPend"></span></h2>
      <div class="botones" id="inicios">
        <button type="button" class="prim" onclick="location.href='abastecimiento.html#nuevo/llegada'">Llegó mercadería</button>
        <button type="button" onclick="location.href='lista-compras.html'">Lista de compras</button>
      </div>
    </div>
    <div class="pend" id="pendientes"></div>
  </section>
  <div class="tarjetas">
    <a class="tarjeta" id="tMin" href="stock.html?bajo_minimo=1"><div class="v">–</div><div class="t">productos bajo el mínimo</div></a>
    <a class="tarjeta" id="tVence" href="stock.html?vence_dias=7"><div class="v">–</div><div class="t">lotes que vencen en 7 días</div></a>
    <a class="tarjeta" id="tFrio" href="frio.html"><div class="v">–</div><div class="t">equipos de frío para revisar</div></a>
    <a class="tarjeta" id="tCompras" href="compras.html"><div class="v">–</div><div class="t">compras por recibir</div></a>
  </div>
  <div class="dos">
    <section>
      <h2>Próximos vencimientos</h2>
      <div class="tabla-wrap"><table class="datos">
        <thead><tr><th>Producto</th><th>Lote</th><th>Dónde</th><th class="num">Cantidad</th><th>Vence</th></tr></thead>
        <tbody id="vence"></tbody></table></div>
    </section>
    <section>
      <h2>Bajo el mínimo</h2>
      <div class="tabla-wrap"><table class="datos">
        <thead><tr><th>Producto</th><th class="num">Hay</th><th class="num">Mínimo</th></tr></thead>
        <tbody id="minimo"></tbody></table></div>
    </section>
  </div>
  <p class="salud"><span class="p" id="p"></span><span id="t">consultando…</span></p>
</main>
<script src="comun.js"></script>
<script>
function tarjeta(id, n, tipo) {
  const t = $(id); t.querySelector('.v').textContent = n;
  t.classList.toggle(tipo, n > 0);
}
// Bandeja del proceso de abastecimiento: cada pendiente lleva al paso del asistente que falta (o a la
// factura, si se cargó directo). Primero lo vencido.
const ETAPA_TAG = { 'Por pedir': 'aviso', 'Por pagar': 'aviso', 'Esperando mercadería': '', 'Falta el comprobante': 'aviso', 'Comprobante sin registrar': 'aviso', 'Pedido sin terminar': '' };
async function bandeja() {
  const { usuario: u } = await cargarSesion();
  const { pendientes } = await api('abastecimiento/pendientes');
  const puedeCargar = u.puede.catalogo;
  $('#abastecimiento').hidden = !puedeCargar && !pendientes.length;
  $('#inicios').hidden = !puedeCargar;
  const vencida = p => p.vencimiento && diasHasta(p.vencimiento) < 0;
  pendientes.sort((a, b) => (vencida(b) - vencida(a)) || String(a.vencimiento || a.fecha).localeCompare(String(b.vencimiento || b.fecha)));
  $('#nPend').textContent = pendientes.length ? `${pendientes.length} pendiente${pendientes.length === 1 ? '' : 's'}` : '';
  if (!pendientes.length) return $('#pendientes').replaceChildren(el('p', { className: 'vacio', textContent: 'Nada pendiente: todo lo recibido está facturado y pagado.' }));
  $('#pendientes').replaceChildren(...pendientes.map(p => {
    const v = vencida(p);
    return el('a', { href: p.lista ? 'lista-compras.html' : p.directa ? 'comprobantes.html#' + p.comprobante_id : `abastecimiento.html#${p.compra_id}/${p.paso}` },
      el('span', { className: 'q' }, p.proveedor, ' ', el('span', { className: 'tag ' + (v ? 'mal' : ETAPA_TAG[p.etapa] ?? ''), textContent: v ? 'Vencida' : p.etapa })),
      el('span', { className: 'm', textContent: [p.lista ? 'desde el ' + fecha(p.fecha) : fecha(p.fecha), p.numero, p.renglones ? `${p.renglones} producto${p.renglones === 1 ? '' : 's'}` : null,
        p.vencimiento ? (v ? 'venció el ' : 'vence el ') + fecha(p.vencimiento) : null, p.directa ? 'factura sin compra' : null].filter(Boolean).join(' · ') }),
      el('span', { className: 'i', textContent: p.importe ? pesos(p.importe) : '' }));
  }));
}
bandeja().catch(e => { $('#abastecimiento').hidden = false; $('#pendientes').replaceChildren(el('p', { className: 'msg mal', textContent: e.message })); });
(async () => {
  try {
    const [{ productos }, { stock }, { equipos }, { compras }] = await Promise.all([
      api('stock/productos?bajo_minimo=1'), api('stock?vence_dias=7'), api('frio'), api('compras')]);
    const vence = stock.filter(s => !s.cantidad.startsWith('-') && s.vencimiento);
    tarjeta('#tMin', productos.length, 'aviso');
    tarjeta('#tVence', vence.length, 'mal');
    tarjeta('#tFrio', equipos.filter(e => e.desvio || e.sin_lectura_reciente).length, 'mal');
    tarjeta('#tCompras', compras.filter(c => c.estado === 'pedida' || c.estado === 'borrador').length, 'aviso');
    filas($('#vence'), vence.slice(0, 12), s => el('tr', {},
      td(s.producto), td(s.lote), td(`${s.almacen} · ${s.ubicacion}`),
      td(cant(s.cantidad, s.unidad_base), 'num'), el('td', {}, fecha(s.vencimiento), ' ', tagVence(s.vencimiento))),
      'Nada vence en los próximos 7 días.', 5);
    filas($('#minimo'), productos, p => el('tr', {},
      td(p.nombre), td(cant(p.cantidad, p.unidad_base), 'num'), td(cant(p.stock_minimo, p.unidad_base), 'num')),
      'Ningún producto está bajo el mínimo.', 3);
  } catch (e) { $('#t').textContent = 'Error: ' + e.message; }
  fetch('salud').then(r => r.json()).then(d => {
    $('#p').className = 'p ' + (d.ok ? 'ok' : 'mal');
    $('#t').textContent = d.ok ? `base ${d.base} responde en ${d.ms} ms` : 'la base no responde';
  }).catch(() => { $('#p').className = 'p mal'; $('#t').textContent = 'sin respuesta del servidor'; });
})();
</script>
</body>
</html>
